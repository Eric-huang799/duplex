name: build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: --win
            pattern: release/*.exe
          - os: macos-latest
            flag: --mac
            pattern: release/*.dmg
          - os: ubuntu-latest
            flag: --linux
            pattern: release/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build MCP bridge
        run: npm run build:bridge
      - name: Build app
        run: npm run build
      - name: Package
        run: npx electron-builder ${{ matrix.flag }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: duplex-${{ matrix.os }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # 预发布（如 v0.3.0-beta.1）必须保留 prerelease 标记：
          # GitHub 不允许把 prerelease 同时标成 latest，硬写 --latest 会让这个 job 以 422 失败。
          # 之前 0.3.0-beta.1 的 CI 就是这样红的，而产物其实已经传上去了。
          if [[ "$tag" == *-* ]]; then
            is_pre=1
          else
            is_pre=0
          fi
          if [[ "$is_pre" == "1" ]]; then
            gh release view "$tag" >/dev/null 2>&1 || \
              gh release create "$tag" --title "Duplex $tag" --generate-notes --prerelease
          else
            gh release view "$tag" >/dev/null 2>&1 || \
              gh release create "$tag" --title "Duplex $tag" --generate-notes
          fi
          gh release upload "$tag" artifacts/* --clobber
          # 重新推 tag 可能让 release 变回 draft：确保发布出去；
          # 只有正式版才抢 latest，预发布保持 prerelease。
          if [[ "$is_pre" == "1" ]]; then
            gh release edit "$tag" --draft=false
          else
            gh release edit "$tag" --draft=false --latest
          fi
